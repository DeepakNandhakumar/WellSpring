# Application configuration
spring.application.name=wellspring-backend
server.port=${PORT:8080}

# Database configuration - configure DB_URL, DB_USERNAME and DB_PASSWORD in the environment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wellspring_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: update is retained for local compatibility. Production profile validates schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT: supply a strong unique secret outside source control.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated frontend origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Avoid verbose security logging by default.
logging.level.org.springframework.security=INFO
logging.level.com.wellspring=INFO
