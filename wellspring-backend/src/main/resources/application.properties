# Application Configuration
spring.application.name=wellspring-backend
server.port=${PORT:8080}

# Database Configuration - supply credentials through environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wellspring_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - set a strong, unique secret outside source control
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration - comma-separated trusted frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging - avoid verbose security/debug logs in normal operation
logging.level.org.springframework.security=INFO
logging.level.com.wellspring=INFO
