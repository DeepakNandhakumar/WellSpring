name: One-time dependency remediation

on:
  push:
    branches: [production-readiness]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply compatible security fixes
        working-directory: app
        run: npm audit fix || echo "Some development-only advisories may remain; inspect the final audit report."
      - name: Commit updated lockfile if changed
        run: |
          if git diff --quiet -- app/package-lock.json app/package.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json app/package.json
          git commit -m "Fix vulnerable frontend dependency versions"
          git push origin HEAD:production-readiness
